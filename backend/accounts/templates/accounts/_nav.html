<nav class="account-nav" aria-label="Account">
    <a href="/brawl/" class="brawl-link">Brawl Arena</a>
    {% if user.is_authenticated %}
        <span class="account-user">Signed in as <strong>{{ user.username }}</strong></span>
        {% if user.is_staff %}<a href="{% url 'accounts:admin_control' %}">Admin</a>{% endif %}
        <form method="post" action="{% url 'accounts:logout' %}" class="logout-form">
            {% csrf_token %}
            <button type="submit" class="link-button">Log out</button>
        </form>
    {% else %}
        <a href="{% url 'accounts:login' %}">Log in</a>
        <a href="{% url 'accounts:signup' %}">Sign up</a>
    {% endif %}
</nav>
